<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
        /* Element selector */
        div{
            background-color: red;
        }
        /* class selector */
        .red{
            background-color: red;
        }
        /* ID selector */
        #green{
            background-color: green;
        }
        /* child selector */
        div > p{
            color: blue;
            background-color: brown;

        }
        /* Decendant selector */
        div > p{
            color: blue;
            background-color: brown;

        }
        /* Universal selector */
        *{
            margin:0;
            padding:0;
        }
        /* pseudo selector  */
        a:visited{
            color:rgb(224, 238, 16);
        }
       a:link {
        color: rgb(23, 229, 23);
       }
       a:active{
        background-color: red;
       }


       a:hover{
        background-color: aquamarine;
       }


       p:fisrt-child{
        background-color: aqua;
       }
        
    </style>
</head>

        <p>I am first child</p>

</html>
