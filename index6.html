<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Specificity</title>

    <style>
        /* Specificity of element selector = 1 */
        h1 {
            color: rgb(106, 13, 194);
        }

        /* Specificity of class selector = 10 */
        .yellow {
            color: yellow;
        }

        /* Specificity of class selector = 10 */
        .cpurple {
            color: purple;
        }

        /* Specificity of class selector = 10 */
        .cred {
            color: red;
            background-color: red;
        }

        /* Attribute selector - specificity = 10 */
        [data-x="a"] {
            color: maroon;
        }
    </style>
</head>

<body>

    <div>
        <h1 class="yellow cred cpurple" data-x="a">
            CSS Specificity
        </h1>
    </div>

    <div>
        <h1 class="yellow cred cpurple">
            CSS Specificity
        </h1>
    </div>

</body>
</html>
